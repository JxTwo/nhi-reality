services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhi-reality-web
    command: python3 manage.py runserver 0.0.0.0:8000
    # command: gunicorn core.wsgi:application --chdir /app --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
    tty: true
    stdin_open: true
    depends_on:
      - db
    environment:
      - DEBUG=1
      - DJANGO_ENV=development
      - DJANGO_SETTINGS_MODULE=core.settings
      - DATABASE_URL=postgres://nhi_user:nhi_pass@db:5432/nhi_db

  db:
    image: postgres:15
    container_name: nhi-reality-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhi_db
      POSTGRES_USER: nhi_user
      POSTGRES_PASSWORD: nhi_pass
    volumes:
      - nhi_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6.2
    restart: unless-stopped

  celery:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - ./src:/app
    working_dir: /app
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-beat:
    build: .
    command: >
      celery -A core beat
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --loglevel=info
    volumes:
      - ./src:/app
    working_dir: /app
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:
  nhi_pgdata:
